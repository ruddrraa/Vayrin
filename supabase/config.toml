# Supabase local development configuration
# This file is used by the Supabase CLI.

project_id = "bloodline"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]

[functions]
# JWT is required so auth.uid() works inside functions
verify_jwt = true
